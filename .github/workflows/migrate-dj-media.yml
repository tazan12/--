name: Preserve DJ Letter media independently
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-dj-media.yml
      - scripts/prepare-dj-media.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Copy approved media to GitHub
        run: python3 scripts/prepare-dj-media.py
      - name: Save independent media files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets
          if ! git diff --cached --quiet; then
            git commit -m "Archive DJ Letter footage and narration independently"
            git push origin HEAD:main
          fi
