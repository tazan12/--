name: DJ Letter - Natural player release

on:
  push:
    branches: [main]
    paths:
      - 'scripts/finalize-natural-player.py'
      - '.github/workflows/finalize-natural-player.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the authorized DJ Letter repository
        uses: actions/checkout@v4
      - name: Prepare independent natural player
        run: |
          python3 scripts/finalize-natural-player.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/player.css')
          s = p.read_text()
          marker = 'Settings remain in normal flow'
          if marker not in s:
              s += '\n/* Settings remain in normal flow, including narrow screens. */\n.dj-options[open]{flex:1 1 100%;order:3}.dj-options-panel{position:static;right:auto;top:auto;margin-top:8px;min-width:0;width:100%;max-width:100%;box-shadow:none}.dj-options-panel small{max-width:none}\n'
              p.write_text(s)
          p = Path('docs/player.js')
          s = p.read_text()
          s = s.replace("$('filmState').textContent = labels[state];", "if ($('filmState').textContent !== labels[state]) $('filmState').textContent = labels[state];")
          s = s.replace("if (epoch !== videoEpoch || !canAnimate()) { next.pause(); swapping = false; return; }", "if (epoch !== videoEpoch) return;\n      if (!canAnimate()) { next.pause(); swapping = false; return; }")
          p.write_text(s)
          PY
      - name: Validate assets, syntax and UI wiring
        run: |
          node --check docs/player.js
          node --check docs/episodes.js
          python3 scripts/prepare-dj-media.py
          python3 - <<'PY'
          from pathlib import Path
          import re, json, hashlib
          html = Path('docs/index.html').read_text()
          js = Path('docs/player.js').read_text()
          ids = set(re.findall(r'\bid="([^"]+)"', html))
          refs = set(re.findall(r"\$\('([^']+)'\)", js))
          assert not refs - ids, f'Missing elements: {refs - ids}'
          assert 'filmToggle' not in html and 'id="motion"' not in html
          manifest = json.loads(Path('docs/assets/films/manifest.json').read_text())
          assert len(manifest) == 12
          assert len({item['source_id'] for item in manifest}) == 12
          for ext in ['mp4', 'webp']:
              files = list(Path('docs/assets/films').glob('ep??.' + ext))
              assert len(files) == 12
              assert len({hashlib.sha256(p.read_bytes()).hexdigest() for p in files}) == 12
          for p in Path('docs').rglob('*'):
              if p.suffix in ['.html', '.js', '.css', '.json', '.md']:
                  content = p.read_text()
                  assert 'higgsfield.app' not in content and 'cloudfront.net' not in content, str(p)
          print('PASS: all media local, 12 unique scenes, DOM complete, no legacy hosting URLs')
          PY
      - name: Save the verified release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs README.md scripts/prepare-dj-media.py
          if ! git diff --cached --quiet; then
            git commit -m "Release natural autonomous films and reliable serialized radio playback"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload verified static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
      - name: Deploy the actual release
        id: deployment
        uses: actions/deploy-pages@v4
