name: DJ Letter - GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/mind-store.test.cjs'
      - '.github/workflows/deploy-dj-letter.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate the diary and player before publishing
        run: |
          node --check docs/player.js
          node --check docs/scenery.js
          node --check docs/mind-store.js
          node --check docs/mind-journal.js
          node --check docs/sw.js
          node --test tests/mind-store.test.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
