name: DJ Letter - Stable scenery playback
on:
  push:
    branches: [main]
    paths:
      - scripts/repair-playback-stability.py
      - scripts/scenery-stable.js
      - scripts/finalize-autostart-default.py
      - .github/workflows/repair-playback-stability.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  repair-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout authorized DJ Letter repository
        uses: actions/checkout@v4
      - name: Install standard media encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Prepare compatible footage and automatic playback
        run: |
          python3 scripts/repair-playback-stability.py
          python3 scripts/finalize-autostart-default.py
      - name: Validate release before saving or deploying
        run: |
          node --check docs/player.js
          node --check docs/scenery.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=Path('docs'); report=json.loads((d/'playback-release.json').read_text())
          assert len(report['episodes'])==12
          assert len({x['sha256'] for x in report['episodes']})==12
          assert all(x['frames']>10 for x in report['episodes'])
          h=(d/'index.html').read_text()
          assert h.count('<video ')==1
          assert 'id="filmMotion"' in h and 'filmToggle' not in h
          assert '20261114-stable3' in h
          assert 'still = reduce.matches' not in (d/'scenery.js').read_text()
          for n in range(1,13):
              assert (d/f'assets/films/ep{n:02}.compat.mp4').is_file()
              assert (d/f'assets/films/ep{n:02}.motion.webp').is_file()
              assert (d/f'assets/voice/ep{n:02}.mp3').is_file()
          print('PASS: automatic playback, 12 native and fallback scenes, no inherited pause')
          PY
      - name: Save validated media and source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ scripts/scenery-stable.js scripts/repair-playback-stability.py
          if ! git diff --cached --quiet; then
            git commit -m "Activate requested automatic scenery default with decoder-independent recovery"
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
      - name: Deploy the complete repair
        id: deployment
        uses: actions/deploy-pages@v4
